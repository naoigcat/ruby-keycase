[tools]
ruby = "3.4.9"

[tasks.rubocop23]
description = "RuboCop in Docker (official ruby:2.3.8)"
run = "docker compose -f compose/compose.yaml -f compose/compose.ruby23.yaml run --rm app bash -c \"bundle install --jobs 4 --retry 3; bundle exec rubocop\""

[tasks.rspec23]
description = "RSpec in Docker (official ruby:2.3.8)"
run = "docker compose -f compose/compose.yaml -f compose/compose.ruby23.yaml run --rm app bash -c \"bundle install --jobs 4 --retry 3; bundle exec rspec\""

