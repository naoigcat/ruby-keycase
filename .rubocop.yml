inherit_from:
  - rubocop/.rubocop.default.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 2.5
  DisplayCopNames: true
  DisplayStyleGuide: true
  NewCops: enable

Naming/BlockForwarding:
  Enabled: false

# The Docker configuration loads the shared settings from /app instead.
Style/SymbolProc:
  Exclude:
    - lib/keycase/*_case.rb
