# frozen_string_literal: true

name: Release Gem

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Must match Keycase::VERSION.
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Ensure main branch
        run: test "$GITHUB_REF_NAME" = "main"

      - name: Verify release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ruby -Ilib -e '
            expected = ENV.fetch("VERSION")
            require "keycase/version"
            if Keycase::VERSION != expected
              warn "workflow version input (#{expected}) does not match Keycase::VERSION (#{Keycase::VERSION})"
              exit 1
            end
          '

      - name: Verify release tag is new
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Run RSpec
        run: bundle exec rspec

      - name: Release gem
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092
