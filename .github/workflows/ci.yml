# frozen_string_literal: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["2.3", "2.4", "2.5", "2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run RuboCop and RSpec in Docker
        env:
          RUBY_VERSION: ${{ matrix.ruby-version }}
        run: |
          docker compose -f compose/compose.yaml -f "compose/compose.ruby${RUBY_VERSION//./}.yaml" \
            run --rm app bash -ec 'bundle install --jobs 4 --retry 3; bundle exec rubocop; bundle exec rspec'
